# 前端静态托管 + 反代（容器内 /etc/nginx/conf.d/default.conf）
#
# 说明：
# - backend 为 docker-compose 中的后端服务名；独立部署请改为实际后端地址。
# - 生产 CSP 见 deploy/csp.conf：其 nonce 为占位符（REPLACE_WITH_GATEWAY_NONCE），
#   必须由入口网关/OpenResty 注入真实 nonce 后启用，否则内联脚本会被拦截导致白屏。
#   因此此处默认【不】加载 CSP，确认 nonce 注入链路就绪后取消最后一行的注释。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代：/api/v1/**
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 告警实时推送 WebSocket（VITE_ALARM_WS_URL=ws://<host>/ws/alarm）
    location /ws/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # include /etc/nginx/conf.d/csp.conf;
}
