# 生产 CSP 模板（S1 §10.2 / §9.4 离线部署）
#
# 部署要求：
# 1. 移除 dev 态的 'unsafe-inline'：script-src / style-src 改用 'nonce-<random>'；
# 2. nonce 由入口网关 / OpenResty 在响应头随机生成并注入，前端构建产物需 nonce 感知
#    （Vite 产物若含内联 <script>/<style>，需改为 nonce 感知或改用 hash 白名单）；
# 3. connect-src 收紧至同源 / 内网 WebSocket，禁止公网；
# 4. img-src 仅 'self' data: blob:（离线瓦片同源，见 src/constants/map.ts 默认 /tiles）。
#
# ---- OpenResty (lua) 注入示例 ----
# header_filter_by_lua_block {
#   local nonce = ngx.encode_base64(tostring(ngx.now()) .. ngx.worker.pid())
#   ngx.header["Content-Security-Policy"] =
#     "default-src 'self';" ..
#     "script-src 'self' 'nonce-" .. nonce .. "';" ..
#     "style-src 'self' 'nonce-" .. nonce .. "';" ..
#     "img-src 'self' data: blob:;" ..
#     "font-src 'self' data:;" ..
#     "connect-src 'self' wss:;" ..
#     "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
# }
#
# ---- 备用：静态占位（部署时由网关替换为真实 nonce）----
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-REPLACE_WITH_GATEWAY_NONCE'; style-src 'self' 'nonce-REPLACE_WITH_GATEWAY_NONCE'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
