# 生产 CSP 模板（S1 §10.2 / §9.4 离线部署 / feat-gis-cesium 适配）
#
# 部署要求：
# 1. 移除 dev 态的 'unsafe-inline'：script-src / style-src 改用 'nonce-<random>'；
# 2. nonce 由入口网关 / OpenResty 在响应头随机生成并注入，前端构建产物需 nonce 感知
#    （Vite 产物若含内联 <script>/<style>，需改为 nonce 感知或改用 hash 白名单）；
# 3. script-src 必须保留 'unsafe-eval' + 'wasm-unsafe-eval'：Cesium 1.x 引擎内部用 new Function() 动态编译
#    GLSL 着色器与 Worker 脚本；Worker 解码 Draco/QuantizedMesh 时用 WebAssembly.instantiate。
#    两者都是引擎硬性需求，无法仅靠前端消除。
#    若未来 Cesium 升级到不再依赖 eval/wasm，可同步移除（需回归测试）；
# 4. connect-src 收紧至同源 / 内网 WebSocket，禁止公网；
# 5. img-src 仅 'self' data: blob:（离线瓦片同源，见 src/constants/map.ts 默认 /tiles）。
#
# ---- OpenResty (lua) 注入示例 ----
# header_filter_by_lua_block {
#   local nonce = ngx.encode_base64(tostring(ngx.now()) .. ngx.worker.pid())
#   ngx.header["Content-Security-Policy"] =
#     "default-src 'self';" ..
#     "script-src 'self' 'nonce-" .. nonce .. "' 'unsafe-eval' 'wasm-unsafe-eval';" ..
#     "style-src 'self' 'nonce-" .. nonce .. "';" ..
#     "img-src 'self' data: blob:;" ..
#     "font-src 'self' data:;" ..
#     "connect-src 'self' wss:;" ..
#     "frame-src 'self' blob:;" ..   -- wujie 沙箱：主壳注入同源 blob 文档 iframe 承载子应用
#     "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
# }
#
# ---- 备用：静态占位（部署时由网关替换为真实 nonce）----
# 注意 frame-src 'self' blob: 为新增：wujie 微前端主壳注入同源 blob 沙箱 iframe 承载子应用（S1 禁 any / A7 样式隔离）
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-REPLACE_WITH_GATEWAY_NONCE' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'nonce-REPLACE_WITH_GATEWAY_NONCE'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
