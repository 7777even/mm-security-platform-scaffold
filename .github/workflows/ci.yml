name: Frontend CI

on:
  push:
    branches: [feature/scaffold-rebuild, main]
  pull_request:
    branches: [feature/scaffold-rebuild, main]
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 + 单测 + 契约四铁律 + 生产构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出前端源码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（vue-tsc）
        run: npm run type-check

      - name: 单元测试（vitest）
        run: npm run test

      # 大屏门禁：逐条解析 src/screen 的 import，白名单之外的 lib/data 值导入直接 FAIL，
      # 防本地业务数据回退（详见 scripts/screen-local-data-gate.mjs，白名单已固化）。
      - name: 大屏门禁（screen 本地数据零回退）
        run: npm run gate:screen

      # docs/api 四铁律：summary/description/example/字段 description 齐备 + $ref 可解析
      - name: 契约四铁律校验
        run: node scripts/validate-api-contracts.mjs

      # openspec 闭环纪律守门（与后端仓同款脚本）：changes/ 下不允许 tasks 全勾未归档、
      # archive/ 必须带日期前缀；四件套缺失为告警（存量 Change 允许只有 proposal+tasks）。
      - name: OpenSpec 卫生检查（全勾必归档）
        run: node scripts/check-openspec-hygiene.mjs

      - name: 生产构建（vue-tsc -b && vite build）
        run: npm run build

      # 构建产物可追溯性对齐后端（后端上传 jacoco 报告）：仅构建成功时上传 dist/
      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn

  # 为什么前端仓也要跑对拍：契约真源在本仓 docs/api，后端 CI 的 contract-guard 会
  # 拉取本仓契约去对拍后端实现。也就是说「后端推送时契约是否已更新」是一个时序耦合
  # —— 契约没先推，后端 CI 必红，且后端同学看不出该找谁修。
  # 在本仓跑同一套对拍（拉后端 main 的实现侧）后，契约一改就能立刻看到对后端实现的
  # 漂移，顺序由此从「人工纪律」变成「可验证的前置条件」：本 job 绿 → 后端对拍才可能绿。
  contract-guard:
    name: 跨库 API 契约守门（契约 vs 后端实现）
    runs-on: ubuntu-latest
    steps:
      - name: 检出前端源码（契约真源侧）
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 守门脚本 check-api-contract.mjs 位于后端仓，且用 __dirname 定位仓库根，
      # 因此需把后端仓的 scripts/ 与 src/main/java 一起稀疏拉出后在子目录内执行。
      # 若后端仓为私有：在本仓 Settings → Secrets 配置 CONTRACT_REPO_TOKEN（PAT）。
      - name: 检出后端实现（跨仓，仅 scripts + src/main/java）
        uses: actions/checkout@v4
        with:
          repository: 7777even/mm-security-platform-backend
          ref: main
          path: backend-scaffold
          sparse-checkout: |
            scripts
            src/main/java
          sparse-checkout-cone-mode: false
          token: ${{ secrets.CONTRACT_REPO_TOKEN || github.token }}

      - name: 契约对拍（strict：路由差异或 schema 漂移任一 > 0 即失败）
        run: node backend-scaffold/scripts/check-api-contract.mjs --contracts docs/api --strict

      - name: 失败排查指引
        if: failure()
        run: |
          echo "::error::契约与后端 main 实现存在漂移。按 AGENTS.md §11 四同步处理："
          echo "  1) 若漂移源于契约标注（后端实现与种子数据为准）→ 改 docs/api/<domain>.openapi.json"
          echo "  2) 若漂移源于后端实现 → 改后端并先推送后端，再回到本仓跑 npm run gen:api-types"
          echo "  3) 无论如何，本仓（契约侧）必须先绿并推送，后端的 contract-guard 才可能通过"
