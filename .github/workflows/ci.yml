name: Frontend CI

on:
  push:
    branches: [feature/scaffold-rebuild, main]
  pull_request:
    branches: [feature/scaffold-rebuild, main]
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 + 单测 + 契约四铁律 + 生产构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出前端源码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（vue-tsc）
        run: npm run type-check

      - name: 单元测试（vitest）
        run: npm run test

      # docs/api 四铁律：summary/description/example/字段 description 齐备 + $ref 可解析
      - name: 契约四铁律校验
        run: node scripts/validate-api-contracts.mjs

      # openspec 闭环纪律守门（与后端仓同款脚本）：changes/ 下不允许 tasks 全勾未归档、
      # archive/ 必须带日期前缀；四件套缺失为告警（存量 Change 允许只有 proposal+tasks）。
      - name: OpenSpec 卫生检查（全勾必归档）
        run: node scripts/check-openspec-hygiene.mjs

      - name: 生产构建（vue-tsc -b && vite build）
        run: npm run build

      # 构建产物可追溯性对齐后端（后端上传 jacoco 报告）：仅构建成功时上传 dist/
      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn
