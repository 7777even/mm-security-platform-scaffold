name: E2E (Playwright)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'apps/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'vite.config.ts'

# 本工作流在前端仓运行，并额外拉取后端仓以起隔离端口(8899)的验证后端。
# 后端启动命令以 MEMORY.md「命令 / 门禁」为准（JAVA_HOME + mvn -s ci-settings.xml）。
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          # 必须显式指定 repository + ref，否则两处必错：
          #   1) 默认仓库是「触发本 workflow 的前端仓」，拉不到后端代码；
          #   2) 默认 ref 是本 workflow 的分支（如 feature/scaffold-rebuild），后端仓无该分支 → checkout 失败。
          # 与 ci.yml 的 contract-guard 保持同一写法；后端仓为私有则配 CONTRACT_REPO_TOKEN。
          repository: 7777even/mm-security-platform-backend
          ref: main
          path: backend
          token: ${{ secrets.CONTRACT_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend (isolated :8899, H2 dev)
        working-directory: backend
        # 不再用 secrets.JAVA_HOME 覆盖：actions/setup-java 已正确导出 JAVA_HOME，
        # 若该 secret 未配置会被解析为空串反而覆盖掉正确的值，导致 mvn 找不到 JDK。
        run: |
          unset SERVER__PORT
          nohup mvn -s ci-settings.xml -q -DskipTests spring-boot:run \
            -Dspring-boot.run.arguments="--SERVER__PORT=8899" > /tmp/backend-e2e.log 2>&1 &
          ok=""
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8899/actuator/health >/dev/null; then ok=1; break; fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::后端未能在 8899 就绪，输出末尾 80 行："
            tail -80 /tmp/backend-e2e.log
            exit 1
          fi
          echo "后端在 8899 就绪。"

      - name: Run E2E
        working-directory: frontend
        env:
          E2E_API_BASE: http://localhost:8899/api/v1
          E2E_DEV_USER: admin
          E2E_DEV_PASSWORD: admin@2026
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
